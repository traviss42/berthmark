services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Database Service (PostgreSQL with PostGIS)
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: berthmark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maritime_risk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-maritime_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - berthmark-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Cache Service (Redis)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: berthmark-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - berthmark-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API Service (FastAPI)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berthmark-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/berthmark.db}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-berthmark-development-insecure-secret-key-change-in-production}
      PORT: 8000
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - berthmark-net

  # ─────────────────────────────────────────────────────────────────────────────
  # AIS Stream Worker Service (Background Worker)
  # ─────────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berthmark-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/berthmark.db}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      RUN_MIGRATIONS: "false"
    command: ["uv", "run", "python", "-m", "backend.ais.stream_worker"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - berthmark-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Web Service (Vite React + Nginx Reverse Proxy)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: berthmark-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - berthmark-net

networks:
  berthmark-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
